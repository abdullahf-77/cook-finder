name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (OpenCV runtime libs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import-verify backend (loads the model, no server started)
        run: python -c "import main; print('OK:', len(main.model.names), 'classes,', len(main.RECIPES), 'recipes')"

      - name: Syntax-check frontend config
        run: node --check config.js
